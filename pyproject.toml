[project]
name = "qq-bot"
version = "0.1.0"
description = "QQ 多功能 Bot — 智能问答、B站解析、群友画像、每日总结"
requires-python = ">=3.12"
dependencies = [
    "nonebot2[fastapi]>=2.4.0",
    "nonebot-adapter-onebot>=2.4.0,<2.5.0",
    "nonebot-plugin-apscheduler>=0.4.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "tenacity>=9.0",
    "thefuzz[speedup]>=0.22",
    "jieba>=0.42",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "nonebug>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.nonebot]
adapters = ["nonebot_adapters_onebot.v11"]
plugins = ["src.plugins.qa", "src.plugins.bilibili", "src.plugins.profile", "src.plugins.summary"]
